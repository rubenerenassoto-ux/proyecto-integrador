<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - TecnoRepara</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>TecnoRepara</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contacto</h2>
            <p>Calle Falsa 123 - Abierto de lunes a viernes de 9:00 a 14:00 y de 17:00 a 20:00.</p>

            <form>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>

                <label for="mensaje">¿Qué le pasa a tu equipo?</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Describe el problema de tu ordenador..." required></textarea>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Proyecto de IAW - 2º ASIR</p>
    </footer>
</body>
</html>
